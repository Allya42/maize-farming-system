<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Harvests | Maize 360°</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'farmer') window.location.href = 'login.html';
  </script>
  <style>
    body { background-color: #f8faf8; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .top-bar h2 { margin: 0; color: #1f2d1f; font-size: 1.8rem; }
    .table-wrap { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: none; }
    table th { background: #f8faf8; color: #6b7a6b; border-bottom: 1px solid #edf2ed; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" style="background: #14532d;">
      <h1 style="display: flex; align-items: center; gap: 8px;">🌽 Maize 360°</h1>
      <nav>
        <a href="farmer-dashboard.html">Dashboard</a>
        <a href="my-fields.html">My Fields</a>
        <a href="my-harvests.html" class="active" style="background: rgba(255,255,255,0.1); border-left-color: #86efac;">My Harvests</a>
        <a href="my-diseases.html">Report Disease</a>
        <a href="#" class="logout-link" onclick="logout()">Logout</a>
      </nav>
    </aside>

    <main class="main">
      <div class="top-bar">
        <div>
          <h2>My Harvest Records</h2>
          <p style="margin: 5px 0 0 0; color: #6b7a6b; font-size: 0.9rem;">Log your yield and track your earnings.</p>
        </div>
        <button class="btn btn-primary" onclick="openModal()">+ Log New Harvest</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Harvest ID</th>
              <th>Farm ID</th>
              <th>Season</th>
              <th>Quantity (Kg)</th>
              <th>Date</th>
              <th>Price / Kg</th>
              <th>Total Revenue</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="harvestsTableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="harvestModal">
    <div class="modal-card">
      <h3 id="modalTitle">Log New Harvest</h3>
      <form id="harvestForm">
        <div class="form-grid">
          <div>
            <label>Harvest ID (e.g., HR006)</label>
            <input type="text" id="harvestId" required>
          </div>
          <div>
            <label>My Farm</label>
            <select id="farmId" required>
              <option value="">Loading your farms...</option>
            </select>
          </div>
          <div>
            <label>Season</label>
            <input type="text" id="season" placeholder="e.g., Season A 2024" required>
          </div>
          <div>
            <label>Harvest Date</label>
            <input type="date" id="harvestDate" required>
          </div>
          <div>
            <label>Quantity Harvested (Kg)</label>
            <input type="number" id="quantityKg" step="0.1" min="0.1" required oninput="updateLiveRevenue()">
          </div>
          <div>
            <label>Market Price per Kg (UGX)</label>
            <input type="number" id="marketPricePerKg" step="0.1" min="0.1" required oninput="updateLiveRevenue()">
          </div>
          
          <div class="full" style="background: #f1f7f1; padding: 12px; border-radius: 8px; margin-top: 10px;">
            <strong>Total Revenue: </strong>
            <span id="liveRevenueDisplay" style="color: #16a34a; font-size: 1.2rem; font-weight: bold;">UGX 0</span>
          </div>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Harvest</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let isEditing = false;
    let myFarmsData = []; // Store farms to filter the table
    let allMyHarvests = [];

    function generateUniqueHarvestId() {
      const currentIds = allMyHarvests.map(h => String(h.harvestId || '').trim().toUpperCase());
      const numericIds = currentIds
        .filter(id => /^HR\d+$/.test(id))
        .map(id => Number(id.replace(/^HR/, '')))
        .filter(num => !Number.isNaN(num));

      let nextNumber = 1;
      if (numericIds.length) {
        nextNumber = Math.max(...numericIds) + 1;
      }

      return `HR${String(nextNumber).padStart(3, '0')}`;
    }

    // 1. Load only THIS farmer's harvests
    async function loadHarvests() {
      try {
        // First get the farmer's farms
        const farmsRes = await apiFetch(`/farms?farmerId=${user.farmerId}`);
        myFarmsData = farmsRes.data;
        const myFarmIds = myFarmsData.map(f => f.farmId);

        // Then get all harvests, and build the generation list from the whole system so IDs never overlap
        const harvestRes = await apiFetch('/harvests');
        allMyHarvests = harvestRes.data;
        const myHarvests = harvestRes.data.filter(h => myFarmIds.includes(h.farmId));

        const tbody = document.getElementById('harvestsTableBody');
        
        if (myHarvests.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="empty">You haven't logged any harvests yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = myHarvests.map(h => `
          <tr>
            <td><strong>${h.harvestId}</strong></td>
            <td>${h.farmId}</td>
            <td>${h.season}</td>
            <td>${h.quantityKg.toLocaleString()}</td>
            <td>${formatDate(h.harvestDate)}</td>
            <td>${formatCurrency(h.marketPricePerKg)}</td>
            <td style="font-weight: bold; color: #16a34a;">${formatCurrency(h.totalRevenue)}</td>
            <td class="actions">
              <button class="btn btn-sm" onclick='editHarvest(${JSON.stringify(h)})'>Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteHarvest('${h.harvestId}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // 2. Live Revenue Calculation
    function updateLiveRevenue() {
      const qty = Number(document.getElementById('quantityKg').value) || 0;
      const price = Number(document.getElementById('marketPricePerKg').value) || 0;
      document.getElementById('liveRevenueDisplay').textContent = formatCurrency(qty * price);
    }

    // 3. Populate the Farm dropdown (ONLY THEIR FARMS)
    function populateFarmDropdown(selectedId = null) {
      const select = document.getElementById('farmId');
      select.innerHTML = `<option value="">Select a farm...</option>` + 
        myFarmsData.map(f => `<option value="${f.farmId}">${f.farmId} - ${f.location}</option>`).join('');
      
      if (selectedId) select.value = selectedId;
    }

    // 4. Open Modal
    async function openModal(harvest = null) {
      document.getElementById('harvestModal').classList.add('open');
      document.getElementById('harvestForm').reset();
      
      if (harvest) {
        isEditing = true;
        document.getElementById('modalTitle').textContent = 'Edit Harvest Record';
        document.getElementById('harvestId').value = harvest.harvestId;
        document.getElementById('harvestId').disabled = true;
        populateFarmDropdown(harvest.farmId);
        document.getElementById('season').value = harvest.season;
        document.getElementById('harvestDate').value = new Date(harvest.harvestDate).toISOString().split('T')[0];
        document.getElementById('quantityKg').value = harvest.quantityKg;
        document.getElementById('marketPricePerKg').value = harvest.marketPricePerKg;
        updateLiveRevenue(); 
      } else {
        isEditing = false;
        document.getElementById('modalTitle').textContent = 'Log New Harvest';
        document.getElementById('harvestId').disabled = true;
        document.getElementById('harvestId').value = generateUniqueHarvestId();
        populateFarmDropdown();
        document.getElementById('harvestDate').value = new Date().toISOString().split('T')[0];
        updateLiveRevenue();
      }
    }

    function closeModal() {
      document.getElementById('harvestModal').classList.remove('open');
    }

    // 5. Handle Form Submit
    document.getElementById('harvestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('harvestId').value.trim();
      const payload = {
        harvestId: id,
        farmId: document.getElementById('farmId').value,
        season: document.getElementById('season').value,
        harvestDate: document.getElementById('harvestDate').value,
        quantityKg: Number(document.getElementById('quantityKg').value),
        marketPricePerKg: Number(document.getElementById('marketPricePerKg').value)
      };

      if (!isEditing && allMyHarvests.some(h => h.harvestId.toUpperCase() === id.toUpperCase())) {
        showToast(`Harvest ID '${id}' already exists. Please use a unique ID.`, 'error');
        return;
      }

      try {
        if (isEditing) {
          await apiFetch(`/harvests/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
          showToast('Harvest updated successfully');
        } else {
          await apiFetch('/harvests', { method: 'POST', body: JSON.stringify(payload) });
          showToast('Harvest logged successfully');
        }
        closeModal();
        loadHarvests();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    function editHarvest(harvest) {
      openModal(harvest);
    }

    // 6. Delete Harvest
    async function deleteHarvest(id) {
      if (!confirm(`Delete harvest record ${id}?`)) return;
      try {
        await apiFetch(`/harvests/${id}`, { method: 'DELETE' });
        showToast('Harvest deleted');
        loadHarvests();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // Initial load
    loadHarvests();
  </script>
</body>
</html>
