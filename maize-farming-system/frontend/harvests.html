<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    // Protect this page: kick to login if not logged in as admin
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'admin') {
      window.location.href = 'login.html';
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Records | Maize Farming System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h1>🌽 Maize Records</h1>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="farmers.html">Farmers</a>
        <a href="farms.html">Farms</a>
        <a href="diseases.html">Disease Reports</a>
        <a href="harvests.html">Harvest Records</a>
        <a href="#" class="logout-link" onclick="logout()">Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="page-header">
        <h2>Harvest Records</h2>
        <button class="btn btn-primary" onclick="openModal()">+ Record Harvest</button>
      </header>

      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" id="seasonFilter" placeholder="Filter by season (e.g., A 2024)..." oninput="debounceSearch()">
        <select id="farmFilter" onchange="loadHarvests()">
          <option value="">All Farms</option>
          <!-- Populated by JS -->
        </select>
      </div>

      <!-- Harvest Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Harvest ID</th>
              <th>Farm ID</th>
              <th>Season</th>
              <th>Quantity (Kg)</th>
              <th>Date</th>
              <th>Price / Kg</th>
              <th>Total Revenue</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="harvestsTableBody">
            <!-- Rows will be inserted here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="harvestModal">
    <div class="modal-card">
      <h3 id="modalTitle">Record New Harvest</h3>
      <form id="harvestForm">
        <div class="form-grid">
          <div>
            <label>Harvest ID (e.g., HR006)</label>
            <input type="text" id="harvestId" required>
          </div>
          <div>
            <label>Farm</label>
            <select id="farmId" required>
              <option value="">Loading farms...</option>
            </select>
          </div>
          <div>
            <label>Season</label>
            <input type="text" id="season" placeholder="e.g., Season A 2024" required>
          </div>
          <div>
            <label>Harvest Date</label>
            <input type="date" id="harvestDate" required>
          </div>
          <div>
            <label>Quantity Harvested (Kg)</label>
            <input type="number" id="quantityKg" step="0.1" min="0.1" required oninput="updateLiveRevenue()">
          </div>
          <div>
            <label>Market Price per Kg (UGX)</label>
            <input type="number" id="marketPricePerKg" step="0.1" min="0.1" required oninput="updateLiveRevenue()">
          </div>
          
          <!-- Live Revenue Calculator -->
          <div class="full" style="background: #f1f7f1; padding: 12px; border-radius: 8px; margin-top: 10px;">
            <strong>Total Revenue: </strong>
            <span id="liveRevenueDisplay" style="color: var(--primary-dark); font-size: 1.2rem; font-weight: bold;">UGX 0</span>
          </div>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Harvest</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let isEditing = false;
    let searchTimeout;

    // 1. Fetch and render harvests
    async function loadHarvests() {
      const season = document.getElementById('seasonFilter').value;
      const farmId = document.getElementById('farmFilter').value;
      
      let query = `?season=${season}`;
      if (farmId) query += `&farmId=${farmId}`;

      try {
        const res = await apiFetch(`/harvests${query}`);
        const tbody = document.getElementById('harvestsTableBody');
        
        if (res.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="empty">No harvest records found.</td></tr>`;
          return;
        }

        tbody.innerHTML = res.data.map(h => `
          <tr>
            <td><strong>${h.harvestId}</strong></td>
            <td>${h.farmId}</td>
            <td>${h.season}</td>
            <td>${h.quantityKg.toLocaleString()}</td>
            <td>${formatDate(h.harvestDate)}</td>
            <td>${formatCurrency(h.marketPricePerKg)}</td>
            <td style="font-weight: bold; color: #16a34a;">${formatCurrency(h.totalRevenue)}</td>
            <td class="actions">
              <button class="btn btn-sm" onclick='editHarvest(${JSON.stringify(h)})'>Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteHarvest('${h.harvestId}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // 2. Populate the Farm dropdowns (for both filter and modal)
    async function loadFarmsForDropdowns() {
      try {
        const res = await apiFetch('/farms');
        
        // Fill modal dropdown
        const modalSelect = document.getElementById('farmId');
        modalSelect.innerHTML = `<option value="">Select a farm...</option>` + 
          res.data.map(f => `<option value="${f.farmId}">${f.farmId} - ${f.location}</option>`).join('');

        // Fill toolbar filter dropdown
        const filterSelect = document.getElementById('farmFilter');
        filterSelect.innerHTML = `<option value="">All Farms</option>` + 
          res.data.map(f => `<option value="${f.farmId}">${f.farmId}</option>`).join('');
      } catch (err) {
        console.error('Failed to load farms', err);
      }
    }

    // 3. Live Revenue Calculation
    function updateLiveRevenue() {
      const qty = Number(document.getElementById('quantityKg').value) || 0;
      const price = Number(document.getElementById('marketPricePerKg').value) || 0;
      document.getElementById('liveRevenueDisplay').textContent = formatCurrency(qty * price);
    }

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(loadHarvests, 300);
    }

    // 4. Open Modal
    async function openModal(harvest = null) {
      document.getElementById('harvestModal').classList.add('open');
      const form = document.getElementById('harvestForm');
      form.reset();
      
      await loadFarmsForDropdowns();

      if (harvest) {
        isEditing = true;
        document.getElementById('modalTitle').textContent = 'Edit Harvest Record';
        document.getElementById('harvestId').value = harvest.harvestId;
        document.getElementById('harvestId').disabled = true;
        document.getElementById('farmId').value = harvest.farmId;
        document.getElementById('season').value = harvest.season;
        document.getElementById('harvestDate').value = new Date(harvest.harvestDate).toISOString().split('T')[0];
        document.getElementById('quantityKg').value = harvest.quantityKg;
        document.getElementById('marketPricePerKg').value = harvest.marketPricePerKg;
        updateLiveRevenue(); // Trigger calculation for edit
      } else {
        isEditing = false;
        document.getElementById('modalTitle').textContent = 'Record New Harvest';
        document.getElementById('harvestId').disabled = false;
        document.getElementById('harvestDate').value = new Date().toISOString().split('T')[0];
        updateLiveRevenue();
      }
    }

    function closeModal() {
      document.getElementById('harvestModal').classList.remove('open');
    }

    // 5. Handle Form Submit
    document.getElementById('harvestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('harvestId').value;
      const payload = {
        harvestId: id,
        farmId: document.getElementById('farmId').value,
        season: document.getElementById('season').value,
        harvestDate: document.getElementById('harvestDate').value,
        quantityKg: Number(document.getElementById('quantityKg').value),
        marketPricePerKg: Number(document.getElementById('marketPricePerKg').value)
        // Note: The backend automatically calculates totalRevenue
      };

      try {
        if (isEditing) {
          await apiFetch(`/harvests/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
          showToast('Harvest record updated');
        } else {
          await apiFetch('/harvests', { method: 'POST', body: JSON.stringify(payload) });
          showToast('Harvest recorded successfully');
        }
        closeModal();
        loadHarvests();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    function editHarvest(harvest) {
      openModal(harvest);
    }

    // 6. Delete Harvest
    async function deleteHarvest(id) {
      if (!confirm(`Are you sure you want to delete harvest record ${id}?`)) return;
      
      try {
        await apiFetch(`/harvests/${id}`, { method: 'DELETE' });
        showToast('Harvest record deleted');
        loadHarvests();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // Initial Load
    loadFarmsForDropdowns();
    loadHarvests();
  </script>
</body>
</html>
